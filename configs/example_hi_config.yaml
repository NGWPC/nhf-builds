# global settings
output_dir: data/
crs: EPSG:32604
output_name: hi_nhf_0.1.54.gpkg # If not specified, will default to version

# hf builds
build:
  reference_divides_path: data/reference/hi_0.1.5_reference_divides.parquet
  reference_flowpaths_path: data/reference/hi_0.1.5_reference_flowpaths.parquet
  # debug_outlet_count: 2000 # If specified, only the total amount of rivers here will be built
  divide_aggregation_threshold: 3.0

# choose tasks to run
tasks:
  build_hydrofabric: True
  divide_attributes: True
  flowpath_attributes: True
  waterbodies: False
  hydrolocations: False
  gages: True
  fp_crosswalk: False
  nwm_lakes: True

# flowpaths
flowpath_attributes:
  flowpath_id: fp_id
  use_stream_order: True
  dem_path: data/hi/divide-attributes/usgs/hi_dem_250.tif

# divide attributes
divide_attributes:
  processes: 1
  data_dir: data/hi/divide-attributes
  divide_id: div_id
  tmp_dir: data/hi/tmp/divide-attributes
  split_vpu: False
  debug: False
  attributes: # attributes must be specified - there are no defaults
    bexp1:
      file_name: nwm/bexp_0.tif
      agg_type: mode
      field_name: bexp_mode
    isltyp:
      file_name: nwm/ISLTYP.tif
      agg_type: mode
      field_name: isltyp_mode
    ivgtyp:
      file_name: nwm/IVGTYP.tif
      agg_type: mode
      field_name: ivgtyp_mode
    dksat:
      file_name: nwm/dksat_0.tif
      agg_type: weighted_geometric_mean
      field_name: dksat_geomean
    psisat:
      file_name: nwm/psisat_0.tif
      agg_type: weighted_geometric_mean
      field_name: psisat_geomean
    cwpvt:
      file_name: nwm/cwpvt.tif
      agg_type: mean
      field_name: cwpvt_mean
    mp:
      file_name: nwm/mp.tif
      agg_type: mean
      field_name: mp_mean
    mfsno:
      file_name: nwm/mfsno.tif
      agg_type: mean
      field_name: mfsno_mean
    quartz:
      file_name: nwm/quartz_0.tif
      agg_type: mean
      field_name: quartz_mean
    refkdt:
      file_name: nwm/refkdt.tif
      agg_type: mean
      field_name: refkdt_mean
    slope_1km:
      file_name: nwm/slope.tif
      agg_type: mean
      field_name: slope1km_mean
    smcmax:
      file_name: nwm/smcmax_0.tif
      agg_type: mean
      field_name: smcmax_mean
    smcwlt:
      file_name: nwm/smcwlt_0.tif
      agg_type: mean
      field_name: smcwlt_mean
    vcmx:
      file_name: nwm/vcmx25.tif
      agg_type: mean
      field_name: vcmx_mean
    impervious:
      file_name: impervious/hi_full_imperv_percent.tif
      agg_type: mean
      field_name: imperv_mean
    twi:
      file_name: twi/twi_hi.tif
      agg_type: quartile_dist
      field_name: twi_quartile
    twi_2:                      # another twi option
      file_name: twi/twi_hi.tif
      agg_type: quantile_dist
      field_name: twi_quantile
    elevation:
      file_name: usgs/hi_dem_250.tif
      agg_type: mean
      field_name: elevation_mean
    slope:
      file_name: usgs/hi_slope_250.tif
      agg_type: mean
      field_name: slope250m_mean
    aspect:
      file_name: usgs/hi_aspect_250.tif
      agg_type: weighted_circular_mean
      field_name: aspect_circmean
    groundwater:
      file_name: gw/gw_hi_nhf_0.1.5.csv # must include 'gw' or 'groundwater' to be used
      agg_type: groundwater
      field_name: groundwater # field name not honored, all fields in csv will be joined
    axaj:
      file_name: nwm/AXAJ.tif
      agg_type: mean
      field_name: a_xinanjiang_inflection_point_parameter
    bxaj:
      file_name: nwm/BXAJ.tif
      agg_type: mean
      field_name: b_xinanjiang_shape_parameter
    xxaj:
      file_name: nwm/XXAJ.tif
      agg_type: mean
      field_name: x_xinanjiang_shape_parameter

gages:
  gages:
    inputs:
      usgs_discontinued:
        dir: usgs_gages_discontinued
        gage_source_crs: EPSG:4326
        id_col_name: site_no
      usgs_active:
        dir: usgs_active_gages
        id_col_name: site_no
      CIROH_UA:
        path: CIROH_UA/gage_area.csv
        id_col_name: gage
        area_col_name: area_sqkm
      nwm_calib_gages:
        path: nwm_calib/nwm_calib_gages_07112025.csv
        gage_source_crs: EPSG:4326
        id_col_name: site_no
    target:
      crs: EPSG:32604
      snap_tolerance_m: 100.0
      update_existing: True
      exclude_ids: []
      out_gpkg: gages/gages_hi.gpkg
      gpkg_layer_name: gages

  ###--------------------------------------------
  ## A file for USGS upstream area and basins shapefiles
  ###--------------------------------------------
  NLDI_upstream_basins:
    run_NLDI_upstream_basins: False # OCONUS does not have upstream basins
    path: nldi_upstream_basins.gpkg
    layer_polys: NLDI_upstream_basins
    layer_points: "sites"

  ###--------------------------------------------
  ##SNAPPING FLOWPATHS TO GAGES based on upstream catchments area
  ###--------------------------------------------
  assign_fp_to_gages:
   rel_err: 0.25                    # relative acceptable error between total upstream area and USGS upstream area.
   buffer_m: 1000.0                 # Buffering around point gages to find flowpaths. in meters
   parallel: False                  # serial (False) or parallel (True)
   max_workers: null                  # None: if serial
   USGS_NLDI_crs: EPSG:4326      # usgs crs used in NLDI API. more info: https://waterdata.usgs.gov/blog/nldi-intro/
   work_crs: EPSG:32604           # an area-equal crs to calculate buffers and distances


# nwm lakes
nwm_lakes:
  input_path: "data/nwm_lakes/hi_nextgen_workaround.gpkg"
  input_layer: "lakes"
  processed_path: "data/nwm_lakes/hawaii_nwm_lakes.gpkg"
  associate_flowpaths: True
  flowpath_association_method: "point"
  populate_nwm_hydaulics: False
  id_field: "lake_id"
